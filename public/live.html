<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-AYUSH Seva — Live Streams</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0fdf4;
    min-height: 100vh;
    color: #1e293b;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #16a34a, #15803d);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(22,163,74,0.3);
  }

  .header-logo {
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .header-text h1 {
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .header-text p {
    color: rgba(255,255,255,0.75);
    font-size: 0.75rem;
    margin-top: 1px;
  }

  .live-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 99px;
  }

  .live-dot span {
    width: 8px;
    height: 8px;
    background: #fbbf24;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  .live-dot p {
    color: white;
    font-size: 0.72rem;
    font-weight: 600;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Main */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 80px 20px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #dcfce7;
    border-top-color: #16a34a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* No stream */
  .no-stream {
    text-align: center;
    padding: 80px 20px;
    background: white;
    border-radius: 24px;
    border: 2px dashed #bbf7d0;
  }

  .no-stream-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .no-stream h2 {
    color: #475569;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .no-stream p {
    color: #94a3b8;
    font-size: 0.85rem;
  }

  .refresh-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #16a34a;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 99px;
    margin-top: 16px;
  }

  /* Stream card */
  .stream-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    border: 2px solid #bbf7d0;
  }

  .stream-card.live {
    border-color: #ef4444;
    box-shadow: 0 4px 24px rgba(239,68,68,0.15);
  }

  .stream-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }

  .stream-header.live-header {
    background: #ef4444;
    border-bottom: none;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 99px;
  }

  .live-badge span {
    width: 7px;
    height: 7px;
    background: white;
    border-radius: 50%;
    animation: pulse 1s infinite;
  }

  .live-badge p {
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stream-title {
    font-size: 1rem;
    font-weight: 700;
    color: white;
  }

  .stream-title-dark {
    font-size: 1rem;
    font-weight: 700;
    color: #1e293b;
  }

  /* Video */
  .video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    background: #000;
  }

  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Stream footer */
  .stream-footer {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .stream-description {
    color: #64748b;
    font-size: 0.85rem;
    flex: 1;
  }

  .yt-link {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #ef4444;
    color: white;
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .yt-link:hover { background: #dc2626; }

  /* Upcoming section */
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .upcoming-card {
    background: white;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .upcoming-icon {
    width: 42px;
    height: 42px;
    background: #fef9c3;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .upcoming-info h3 {
    font-size: 0.9rem;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 3px;
  }

  .upcoming-info p {
    font-size: 0.78rem;
    color: #94a3b8;
  }

  .countdown {
    margin-left: auto;
    text-align: right;
    flex-shrink: 0;
  }

  .countdown p {
    font-size: 0.85rem;
    font-weight: 700;
    color: #f59e0b;
  }

  .countdown small {
    font-size: 0.68rem;
    color: #cbd5e1;
  }

  /* Footer */
  .page-footer {
    text-align: center;
    padding: 32px 16px;
    color: #94a3b8;
    font-size: 0.75rem;
  }

  .page-footer strong {
    color: #16a34a;
  }

  /* Refresh indicator */
  .refresh-info {
    text-align: center;
    padding: 12px;
    color: #94a3b8;
    font-size: 0.72rem;
  }

  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .stream-title { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">⚕️</div>
  <div class="header-text">
    <h1>e-AYUSH Seva</h1>
    <p>Uttarakhand AYUSH Department</p>
  </div>
  <div class="live-dot">
    <span></span>
    <p>LIVE</p>
  </div>
</div>

<div class="container">
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p style="color:#94a3b8;font-size:0.85rem;">Loading streams...</p>
    </div>
  </div>
  <div class="refresh-info" id="refresh-info"></div>
</div>

<div class="page-footer">
  <strong>e-AYUSH Seva</strong> — Uttarakhand AYUSH Department &nbsp;|&nbsp;
  <a href="/" style="color:#16a34a;text-decoration:none;">Go to App →</a>
</div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://czjxoavqlznzvhypqtwe.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6anhvYXZxbHpuenZoeXBxdHdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTM2ODgsImV4cCI6MjA5Mjg4OTY4OH0.uKLslvmxI106GY_PAQCrxKZVm5KbZ07wG2HBZdSPTZc'
);

function extractYtId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function formatDateTime(dt) {
  return new Date(dt).toLocaleString('en-IN', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit', hour12: true
  });
}

function getCountdown(dt) {
  const diff = new Date(dt).getTime() - Date.now();
  if (diff <= 0) return 'Starting now!';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 24) return `In ${Math.floor(h/24)}d ${h%24}h`;
  if (h > 0) return `In ${h}h ${m}m`;
  return `In ${m}m`;
}

let countdownTimers = [];

function renderStreams(streams) {
  countdownTimers.forEach(clearInterval);
  countdownTimers = [];

  const now = Date.now();
  const live = streams.filter(s => s.is_active);
  const upcoming = streams.filter(s =>
    !s.is_active && s.scheduled_at && new Date(s.scheduled_at).getTime() > now
  ).sort((a, b) => new Date(a.scheduled_at).getTime() - new Date(b.scheduled_at).getTime());

  let html = '';

  if (live.length === 0 && upcoming.length === 0) {
    html = `
      <div class="no-stream">
        <div class="no-stream-icon">📡</div>
        <h2>No live stream at the moment</h2>
        <p>When a live session starts, it will appear here automatically.</p>
        <div class="refresh-badge">
          <span>🔄</span> Auto-refreshes every 30 seconds
        </div>
      </div>`;
  } else {
    // Live streams
    if (live.length > 0) {
      live.forEach(stream => {
        const ytId = extractYtId(stream.youtube_url);
        const embedUrl = ytId ? `https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0` : null;

        html += `
          <div class="stream-card live">
            <div class="stream-header live-header">
              <div class="live-badge"><span></span><p>Live Now</p></div>
              <span class="stream-title">${stream.title}</span>
            </div>
            ${embedUrl ? `
            <div class="video-container">
              <iframe src="${embedUrl}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>` : `
            <div style="padding:40px;text-align:center;background:#fee2e2;color:#ef4444;">
              Invalid YouTube URL
            </div>`}
            <div class="stream-footer">
              ${stream.description ? `<p class="stream-description">${stream.description}</p>` : '<span></span>'}
              <a href="${stream.youtube_url}" target="_blank" class="yt-link">
                ▶ Open on YouTube
              </a>
            </div>
          </div>`;
      });
    }

    // Upcoming streams
    if (upcoming.length > 0) {
      html += `<div class="section-title">📅 Upcoming Sessions</div>`;
      upcoming.forEach(stream => {
        const countdownId = 'cd-' + stream.id;
        html += `
          <div class="upcoming-card">
            <div class="upcoming-icon">🎥</div>
            <div class="upcoming-info">
              <h3>${stream.title}</h3>
              <p>${formatDateTime(stream.scheduled_at)}</p>
              ${stream.description ? `<p style="margin-top:3px;color:#64748b">${stream.description}</p>` : ''}
            </div>
            <div class="countdown">
              <p id="${countdownId}">${getCountdown(stream.scheduled_at)}</p>
              <small>until start</small>
            </div>
          </div>`;

        // Live countdown timer
        const timer = setInterval(() => {
          const el = document.getElementById(countdownId);
          if (el) el.textContent = getCountdown(stream.scheduled_at);
        }, 1000);
        countdownTimers.push(timer);
      });
    }
  }

  document.getElementById('content').innerHTML = html;
}

let lastRefresh = Date.now();

async function fetchStreams() {
  try {
    const { data } = await db
      .from('live_streams')
      .select('*')
      .order('created_at', { ascending: false });

    renderStreams(data || []);
    lastRefresh = Date.now();
  } catch (err) {
    console.error('Error fetching streams:', err);
  }
}

// Auto refresh every 30s
fetchStreams();
setInterval(fetchStreams, 30000);

// Refresh countdown display
setInterval(() => {
  const sec = Math.round((30000 - (Date.now() - lastRefresh)) / 1000);
  const el = document.getElementById('refresh-info');
  if (el) el.textContent = sec > 0 ? `Auto-refreshes in ${sec}s` : 'Refreshing...';
}, 1000);
</script>
</body>
</html>
